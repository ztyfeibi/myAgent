[project]
name = "rag-extension"
version = "0.1.0"
description = "DeerFlow RAG extension: explicit knowledge/general modes and a stub knowledge_search evidence loop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deerflow-extension-api>=0.2,<0.3",
    "langchain>=1.3,<2",
    "langgraph>=1.2.9,<1.3",
]

[project.entry-points."deerflow.extensions"]
rag-extension = "rag_extension:install"

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_extension"]

[tool.ruff]
line-length = 240
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["rag_extension"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
